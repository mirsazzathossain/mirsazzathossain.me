<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 383" role="img" aria-label="Interleaved formal logic verification on the problem: Alice is above Bob, Charlie below Alice, Diana above Charlie; who is higher, Bob or Diana? A natural-language step concludes that Diana is above Bob. The model then writes Z3 code that adds the facts and the negation of the claim. The interpreter answers sat with A equal 3, B equal 2, C equal 0, D equal 1, a counterexample. The next step concludes that the facts do not decide who scores higher." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="360" y="22" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Problem: Alice &gt; Bob, Charlie &lt; Alice, Diana &gt; Charlie. Who scores higher: Bob or Diana?</text>
<rect x="130" y="40" width="580" height="54" rx="6" fill="var(--rose)" fill-opacity="0.08" stroke="var(--rose)" stroke-width="1.8"/>
<text x="120" y="72.0" fill="var(--rose)" font-size="12.5" font-weight="700" text-anchor="end" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">text</text>
<text x="144" y="62" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Charlie &lt; Alice and Diana &gt; Charlie, so Charlie &lt; Diana &lt; Alice.</text>
<text x="144" y="81" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Alice &gt; Bob. Therefore Diana &gt; Bob.</text>
<rect x="130" y="106" width="580" height="130" rx="6" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="1.8"/>
<text x="120" y="176.0" fill="var(--link)" font-size="12.5" font-weight="700" text-anchor="end" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">&lt;code&gt;</text>
<text x="144" y="128" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">from z3 import *</text>
<text x="144" y="147" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">A, B, C, D = Ints('A B C D')</text>
<text x="144" y="166" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">s = Solver()</text>
<text x="144" y="185" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">s.add(A &gt; B, C &lt; A, D &gt; C)</text>
<text x="144" y="204" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">s.add(Not(D &gt; B))   # try to break the claim</text>
<text x="144" y="223" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">print(s.check(), s.model())</text>
<rect x="130" y="248" width="580" height="35" rx="6" fill="var(--amber)" fill-opacity="0.08" stroke="var(--amber)" stroke-width="1.8"/>
<text x="120" y="270.5" fill="var(--amber)" font-size="12.5" font-weight="700" text-anchor="end" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">&lt;interpreter&gt;</text>
<text x="144" y="270" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">sat [A = 3, B = 2, C = 0, D = 1]</text>
<rect x="130" y="295" width="580" height="54" rx="6" fill="var(--green)" fill-opacity="0.08" stroke="var(--green)" stroke-width="1.8"/>
<text x="120" y="327.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="end" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">text</text>
<text x="144" y="317" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">A case with Diana &lt; Bob exists, so Diana &gt; Bob does not follow.</text>
<text x="144" y="336" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Answer: the facts do not decide who scores higher.</text>
<text x="14" y="58" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke"></text>
<text x="360" y="369" fill="var(--ink-3)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The interpreter output is written into the context, so the next step can react to it.</text>
</svg>
