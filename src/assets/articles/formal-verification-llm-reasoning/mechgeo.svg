<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="MechGeo on an illustrative example, Apollonius' theorem. GeoFormalizer: the LLM writes the problem in GeoIR, declaring points A, B and C, assuming a nondegenerate triangle, letting M be the midpoint of BC and stating the goal; a rule-based translator turns it into Lean, Lean checks it, and it is accepted if its score F, 0.7 times a judge score plus 0.3 times point coverage, is at least 0.6. GeoProver: a plan, algebraization into coordinates and polynomials, a certificate from Singular with q equal to the sum of c i times p i, and a check of the identity by the Lean kernel." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="14" y="22" fill="var(--link)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">GeoFormalizer (illustrative example)</text>
<rect x="10" y="34" width="170" height="124" rx="8" fill="var(--ink-3)" fill-opacity="0.1" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="95.0" y="66.0" fill="var(--ink-3)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">problem</text>
<text x="95.0" y="85.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">In triangle ABC,</text>
<text x="95.0" y="102.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">M is the midpoint of BC.</text>
<text x="95.0" y="119.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Prove AB² + AC² =</text>
<text x="95.0" y="136.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2AM² + 2BM².</text>
<line x1="180" y1="96" x2="192" y2="96" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="196" y="34" width="250" height="134" rx="8" fill="var(--link)" fill-opacity="0.05" stroke="var(--link)" stroke-width="1.8"/>
<text x="208" y="53" fill="var(--link)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">LLM writes GeoIR</text>
<text x="208" y="75" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">point A; point B; point C;</text>
<text x="208" y="91" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">assume (nondegenerate_of_</text>
<text x="208" y="107" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  triangle A B C);</text>
<text x="208" y="123" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">let M := midpoint B C;</text>
<text x="208" y="139" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">prove (AB^2 + AC^2 =</text>
<text x="208" y="155" fill="var(--ink)" font-size="11" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  2*AM^2 + 2*BM^2);</text>
<line x1="446" y1="96" x2="458" y2="96" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="462" y="34" width="248" height="124" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="586.0" y="66.0" fill="var(--amber)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">translate + score</text>
<text x="586.0" y="85.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">rule-based translator → Lean</text>
<text x="586.0" y="102.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Lean checks the statement</text>
<text x="586.0" y="119.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">F = 0.7·judge + 0.3·coverage</text>
<text x="586.0" y="136.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">accept if F ≥ 0.6, else repair</text>
<text x="14" y="198" fill="var(--green)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">GeoProver</text>
<rect x="10" y="210" width="166" height="80" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="93.0" y="237.0" fill="var(--green)" font-size="13.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(a) plan</text>
<text x="93.0" y="256.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">which points, angles</text>
<text x="93.0" y="273.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and lemmas to use</text>
<line x1="176" y1="250" x2="186" y2="250" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="188" y="210" width="166" height="80" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="271.0" y="237.0" fill="var(--green)" font-size="13.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(b) algebraize</text>
<text x="271.0" y="256.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">to_poly: points →</text>
<text x="271.0" y="273.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">coordinates, polynomials</text>
<line x1="354" y1="250" x2="364" y2="250" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="366" y="210" width="166" height="80" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="449.0" y="237.0" fill="var(--amber)" font-size="13.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(c) certificate</text>
<text x="449.0" y="256.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Singular finds cᵢ with</text>
<text x="449.0" y="273.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">q = Σ cᵢ pᵢ</text>
<line x1="532" y1="250" x2="542" y2="250" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="544" y="210" width="166" height="80" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<text x="627.0" y="237.0" fill="var(--link)" font-size="13.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(d) Lean kernel</text>
<text x="627.0" y="256.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">checks the identity</text>
<text x="627.0" y="273.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(or a counterexample)</text>
<text x="360" y="316" fill="var(--ink-3)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The CAS is not trusted: it only finds the cᵢ, and Lean verifies the identity.</text>
</svg>
