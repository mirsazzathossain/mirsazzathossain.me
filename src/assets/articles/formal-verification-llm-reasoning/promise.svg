<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" role="img" aria-label="PROMISE. Top: the current goal is matched against every intermediate goal of solved lemmas; the top 30 by structural score are reranked and the top 8 become tactic templates. Middle: an example from the paper. not_empty_lc has structural score 0.43 but goal similarity 0.15 and constant overlap 0.18, so its reranked score is 0.31 and it falls from rank 3 to 14. get_ipc_buffer_words has structural score 0.34 but goal similarity 0.82, so its reranked score is 0.48 and it rises from rank 8 to 3. Bottom: beam search over Isabelle proof states keeps the best states at each depth until a proof is found." font-family="var(--font-sans)">
