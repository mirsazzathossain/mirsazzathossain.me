<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 399" role="img" aria-label="HybridProver. Top: a whole-proof model writes 128 candidates, which are filtered and checked in Isabelle; if none passes, a sketch builder replaces the failed parts with sorry, each sorry is filled by a tactic LLM together with Sledgehammer, and the result is verified with backtracking. Bottom: an example for rev of rev xs equals xs. A candidate proof by induction proves the Nil case by simp but fails in the Cons case with auto. Its sketch keeps the Nil case and leaves the Cons case as sorry, which Sledgehammer fills with simp using the induction hypothesis." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<rect x="10" y="10" width="128" height="78" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<text x="74.0" y="44.5" fill="var(--link)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">whole-proof model</text>
<text x="74.0" y="63.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">128 candidate proofs</text>
<line x1="138" y1="49" x2="148" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="150" y="10" width="130" height="78" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="215.0" y="44.5" fill="var(--amber)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">filter + Isabelle</text>
<text x="215.0" y="63.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">any passes → done</text>
<line x1="280" y1="49" x2="290" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="292" y="10" width="130" height="78" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<text x="357.0" y="44.5" fill="var(--link)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">sketch builder</text>
<text x="357.0" y="63.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">failed parts → sorry</text>
<line x1="422" y1="49" x2="432" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="434" y="10" width="130" height="78" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="499.0" y="36.0" fill="var(--amber)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fill each sorry</text>
<text x="499.0" y="55.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">tactic LLM</text>
<text x="499.0" y="72.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">∪ Sledgehammer</text>
<line x1="564" y1="49" x2="574" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="576" y="10" width="134" height="78" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="643.0" y="36.0" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">verify</text>
<text x="643.0" y="55.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">backtrack over</text>
<text x="643.0" y="72.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the options</text>
<text x="14" y="118" fill="var(--ink)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Example: theorem list_reverse: "rev (rev xs) = xs"</text>
<rect x="10" y="130" width="345" height="185" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="22" y="149" fill="var(--ink-3)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a failed candidate</text>
<text x="22" y="176" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proof (induction xs)</text>
<text x="22" y="197" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  case Nil</text>
<rect x="16" y="203" width="333" height="19" rx="4" fill="var(--green)" fill-opacity="0.13"/>
<text x="22" y="218" fill="var(--green)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?case by simp</text>
<text x="345" y="218" fill="var(--green)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✓</text>
<text x="22" y="239" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next</text>
<text x="22" y="260" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  case (Cons a xs)</text>
<rect x="16" y="266" width="333" height="19" rx="4" fill="var(--rose)" fill-opacity="0.13"/>
<text x="22" y="281" fill="var(--rose)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?case by auto</text>
<text x="345" y="281" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✗</text>
<text x="22" y="302" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">qed</text>
<rect x="365" y="130" width="345" height="185" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="377" y="149" fill="var(--ink-3)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">its sketch</text>
<text x="377" y="176" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proof (induction xs)</text>
<text x="377" y="197" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  case Nil</text>
<rect x="371" y="203" width="333" height="19" rx="4" fill="var(--green)" fill-opacity="0.13"/>
<text x="377" y="218" fill="var(--green)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?case by simp</text>
<text x="377" y="239" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">next</text>
<text x="377" y="260" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  case (Cons a xs)</text>
<rect x="371" y="266" width="333" height="19" rx="4" fill="var(--amber)" fill-opacity="0.13"/>
<text x="377" y="281" fill="var(--amber)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?case sorry</text>
<text x="377" y="302" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">qed</text>
<line x1="355" y1="222.5" x2="363" y2="222.5" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="10" y="331" width="700" height="56" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="360.0" y="354.5" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Sledgehammer fills the sorry: by (simp add: Cons.IH)</text>
<text x="360.0" y="373.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the full proof is checked again by Isabelle ✓</text>
</svg>
