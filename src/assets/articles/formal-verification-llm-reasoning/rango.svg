<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-label="Rango. Top: the tactic generator, called at every step. A proof retriever picks the top k earlier proofs from the project with BM25, a lemma retriever picks the top j earlier lemmas with TF-IDF, and both are given with the current proof to a fine-tuned LLM that writes the next tactic. Bottom: rollout search. Rollout 1 hits a Coq error and starts over. Rollout 2 is incomplete and keeps sampling tactics. Rollout N ends with no goals left, giving a proof." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="14" y="22" fill="var(--link)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Tactic generator (called at every step)</text>
<rect x="10" y="34" width="190" height="58" rx="8" fill="var(--ink-3)" fill-opacity="0.1" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="105.0" y="58.5" fill="var(--ink-3)" font-size="14" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proof bank</text>
<text x="105.0" y="77.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proofs earlier in the project</text>
<rect x="10" y="102" width="190" height="58" rx="8" fill="var(--ink-3)" fill-opacity="0.1" stroke="var(--ink-3)" stroke-width="1.8"/>
