<rect x="288.4" y="318" width="63.599999999999994" height="28" rx="6" fill="var(--link)" fill-opacity="0.12" stroke="var(--link)" stroke-width="1.8"/>
<text x="320.2" y="337" fill="var(--link)" font-size="12" font-weight="600" text-anchor="middle" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">simpl.</text>
<text x="366.0" y="337" fill="var(--link)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">incomplete → keep going</text>
