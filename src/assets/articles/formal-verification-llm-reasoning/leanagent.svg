<line x1="350" y1="80" x2="350" y2="124" stroke="var(--amber)" stroke-width="2.2" stroke-dasharray="6 5"/>
<text x="240" y="90" fill="var(--green)" font-size="11.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">easy</text>
<text x="310" y="90" fill="var(--amber)" font-size="11.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">medium</text>
<text x="395" y="90" fill="var(--rose)" font-size="11.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hard</text>
<line x1="438" y1="82" x2="462" y2="82" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
