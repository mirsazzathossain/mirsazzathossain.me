<text x="588.0" y="79.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">sort repositories by their</text>
<text x="588.0" y="96.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">number of easy theorems:</text>
<text x="588.0" y="113.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">most easy theorems first</text>
<text x="14" y="160" fill="var(--amber)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">For each repository, in curriculum order</text>
<rect x="10" y="172" width="160" height="84" rx="8" fill="var(--ink-3)" fill-opacity="0.1" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="90.0" y="201.0" fill="var(--ink-3)" font-size="14" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">dataset</text>
<text x="90.0" y="220.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">theorems, proofs</text>
<text x="90.0" y="237.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and premises</text>
<line x1="170" y1="214" x2="198" y2="214" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
