<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Solver-in-the-loop for an ASP logic puzzle about three dogs, three people and three walking times, with four hints. The LLM writes the choice rule, which gives 36 answer sets, then one constraint per hint. After hint 1 there are 18 answer sets, after hint 2 there are 6, after hint 3 there are 2, and after hint 4 there is 1, all containing the true solution, so each step is chosen. Another sample for hint 2, which forbids the beagle at 9 instead of requiring it, leaves 12 answer sets that no longer contain the truth and is rejected." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<rect x="10" y="10" width="700" height="96" rx="8" fill="var(--ink-3)" fill-opacity="0.04" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="24" y="32" fill="var(--ink)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Puzzle</text>
<text x="24" y="54" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">dogs: beagle, golden, bernese</text>
<text x="24" y="72" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">people: Tom, Eva, Anna</text>
<text x="24" y="90" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">times: 8, 9, 10</text>
<text x="300" y="32" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 1: Anna walks later than Eva.</text>
<text x="300" y="51" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 2: The beagle is walked at 9.</text>
<text x="300" y="70" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 3: Tom walks the golden retriever.</text>
<text x="300" y="89" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 4: Eva walks at 8.</text>
<text x="150" y="128" fill="var(--ink-3)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">LLM writes</text>
<text x="535" y="128" fill="var(--ink-3)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">clingo computes</text>
<text x="650" y="128" fill="var(--ink-3)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">label</text>
<text x="14" y="172.0" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">choice rule</text>
<rect x="120" y="140" width="330" height="54" rx="6" fill="var(--link)" fill-opacity="0.07" stroke="var(--link)" stroke-width="1.8"/>
<text x="132" y="160" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 { walk(D,P,T) : dog(D),</text>
<text x="132" y="178" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">    person(P) } 1 :- time(T).</text>
<line x1="450" y1="167.0" x2="470" y2="167.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="172.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">36 answer sets</text>
<text x="650" y="172.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">chosen ✓</text>
<text x="14" y="236.0" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 1</text>
<rect x="120" y="204" width="330" height="54" rx="6" fill="var(--link)" fill-opacity="0.07" stroke="var(--link)" stroke-width="1.8"/>
<text x="132" y="224" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">:- walk(_,anna,T1),</text>
<text x="132" y="242" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">   walk(_,eva,T2), T1 &lt;= T2.</text>
<line x1="450" y1="231.0" x2="470" y2="231.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="236.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">18 answer sets</text>
<text x="650" y="236.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">chosen ✓</text>
<text x="14" y="291.0" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 2</text>
<rect x="120" y="268" width="330" height="36" rx="6" fill="var(--link)" fill-opacity="0.07" stroke="var(--link)" stroke-width="1.8"/>
<text x="132" y="288" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">:- walk(beagle,_,T), T != 9.</text>
<line x1="450" y1="286.0" x2="470" y2="286.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="291.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6 answer sets</text>
<text x="650" y="291.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">chosen ✓</text>
<text x="14" y="337.0" fill="var(--rose)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 2 (other)</text>
<rect x="120" y="314" width="330" height="36" rx="6" fill="var(--rose)" fill-opacity="0.07" stroke="var(--rose)" stroke-width="1.8"/>
<text x="132" y="334" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">:- walk(beagle,_,9).</text>
<line x1="450" y1="332.0" x2="470" y2="332.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="337.0" fill="var(--rose)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">12, truth lost</text>
<text x="650" y="337.0" fill="var(--rose)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">rejected ✗</text>
<text x="14" y="383.0" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 3</text>
<rect x="120" y="360" width="330" height="36" rx="6" fill="var(--link)" fill-opacity="0.07" stroke="var(--link)" stroke-width="1.8"/>
<text x="132" y="380" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">:- walk(golden,P,_), P != tom.</text>
<line x1="450" y1="378.0" x2="470" y2="378.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="383.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2 answer sets</text>
<text x="650" y="383.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">chosen ✓</text>
<text x="14" y="429.0" fill="var(--ink)" font-size="12.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">hint 4</text>
<rect x="120" y="406" width="330" height="36" rx="6" fill="var(--link)" fill-opacity="0.07" stroke="var(--link)" stroke-width="1.8"/>
<text x="132" y="426" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">walk(_,eva,8).</text>
<line x1="450" y1="424.0" x2="470" y2="424.0" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="535" y="429.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 answer set</text>
<text x="650" y="429.0" fill="var(--green)" font-size="12.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">chosen ✓</text>
<text x="360" y="466" fill="var(--ink-3)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Each hint can only remove answer sets. A step is chosen while the true solution is still among them.</text>
</svg>
