<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" role="img" aria-label="LongCat-Flash-Prover's three skills and tools. The auto-formalizer turns an informal problem into a Lean statement, checked by a syntax tool and a semantic-consistency tool. The sketcher writes helper lemmas and a main proof, checked by syntax and legality tools. The prover writes a whole proof or proves each lemma; the syntax tool returns PASS, SORRY or FAIL and the legality tool checks that no new axioms were added and the theorem is unchanged. A prover turn: write a proof, call the syntax tool, get an error at line 7, revise, call the tools again, PASS. An example of a hacked proof that declares its own axiom is rejected by the legality tool." font-family="var(--font-sans)">
