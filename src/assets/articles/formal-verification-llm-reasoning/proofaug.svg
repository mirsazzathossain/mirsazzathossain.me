<rect x="371" y="106" width="333" height="19" rx="4" fill="var(--amber)" fill-opacity="0.13"/>
<text x="377" y="121" fill="var(--amber)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  have "x² - 4 = 0" sorry</text>
<text x="377" y="142" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?thesis by auto</text>
<text x="377" y="163" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">qed</text>
<text x="377" y="184" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">show ?thesis using c0 c1 by auto</text>
<text x="365" y="215" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The rest of the structure passes.</text>
<text x="10" y="256" fill="var(--ink)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(c) ATPs try each sorry</text>
