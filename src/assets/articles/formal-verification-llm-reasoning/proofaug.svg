<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="ProofAug on an Isabelle proof. (a) The model's full proof fails at the inner step x squared minus 4 equals 0. (b) The failed step is replaced by sorry, giving the maximal compatible semi-proof, and the rest passes. (c) Automated provers try each sorry; c0 is proved but the inner step is not. (d) One level up, the whole block proving c1 becomes a single sorry, which the automated provers prove, completing the proof." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="10" y="24" fill="var(--ink)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(a) the model's full proof</text>
<rect x="10" y="34" width="345" height="163" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="22" y="58" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">have c0: "x &gt; 0" by auto</text>
<text x="22" y="79" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">have c1: "x² = 4"</text>
<text x="22" y="100" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proof -</text>
<rect x="16" y="106" width="333" height="19" rx="4" fill="var(--rose)" fill-opacity="0.13"/>
<text x="22" y="121" fill="var(--rose)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  have "x² - 4 = 0" by simp</text>
<text x="345" y="121" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✗</text>
<text x="22" y="142" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?thesis by auto</text>
<text x="22" y="163" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">qed</text>
<text x="22" y="184" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">show ?thesis using c0 c1 by auto</text>
<text x="10" y="215" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Isabelle fails at the inner step.</text>
<text x="365" y="24" fill="var(--ink)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(b) MCSP: failed step → sorry</text>
<rect x="365" y="34" width="345" height="163" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="377" y="58" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">have c0: "x &gt; 0" by auto</text>
