<text x="700" y="332" fill="var(--green)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✓</text>
<text x="365" y="363" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">The larger goal is easier: proved.</text>
