<text x="345" y="290" fill="var(--green)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✓</text>
<text x="22" y="311" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">have c1: "x² = 4"</text>
<text x="22" y="332" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">proof -</text>
<rect x="16" y="338" width="333" height="19" rx="4" fill="var(--rose)" fill-opacity="0.13"/>
<text x="22" y="353" fill="var(--rose)" font-size="11.5" font-weight="500" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  have "x² - 4 = 0" ATP?</text>
<text x="345" y="353" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="end" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">✗</text>
<text x="22" y="374" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  then show ?thesis by auto</text>
<text x="22" y="395" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">qed</text>
<text x="22" y="416" fill="var(--ink)" font-size="11.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">show ?thesis using c0 c1 by auto</text>
<text x="10" y="447" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Sledgehammer cannot prove it.</text>
<text x="365" y="256" fill="var(--ink)" font-size="13.5" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">(d) one level up: block → sorry</text>
