<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 389" role="img" aria-label="ReCent-Prover. Top: retrieval with planning. For the subgoal of approx_scale, the LLM writes the plan rearrange the multiplication to isolate m, which matches the description of the lemma mulRCA, while BM25 would prefer lemmas about exp2R. Bottom: validation with reflection. intros is a safe kind of tactic and is not reflected on; induction l1 is risky and is reflected on; reflection explains that induction after intros fixes pos, so the induction hypothesis does not match the goal. The tactics from there on are dropped and a failure record with the subgoal, tactics and explanation is added to the prompt for that subgoal." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="14" y="22" fill="var(--link)" font-size="14" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Retrieval with planning</text>
<rect x="10" y="34" width="250" height="95" rx="8" fill="var(--link)" fill-opacity="0.05" stroke="var(--link)" stroke-width="1.8"/>
<text x="22" y="53" fill="var(--link)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">subgoal (approx_scale)</text>
<text x="22" y="78" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">range1 m</text>
<text x="22" y="97" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">  (exp2R s *</text>
<text x="22" y="116" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="start" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">   (m / exp2R s))</text>
<line x1="260" y1="81.5" x2="284" y2="81.5" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="288" y="34" width="200" height="95" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="388.0" y="60.0" fill="var(--amber)" font-size="14" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">LLM writes a plan</text>
<text x="388.0" y="79.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">“rearrange the</text>
<text x="388.0" y="96.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">multiplication to</text>
<text x="388.0" y="113.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">isolate m”</text>
<line x1="488" y1="81.5" x2="512" y2="81.5" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="516" y="34" width="194" height="95" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="613.0" y="60.0" fill="var(--green)" font-size="14" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">best match</text>
<text x="613.0" y="79.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">lemma mulRCA,</text>
<text x="613.0" y="96.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">described as “moves</text>
<text x="613.0" y="113.0" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a factor to the front”</text>
<text x="360" y="151" fill="var(--ink-3)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Plan steps and lemma descriptions are both natural language, compared by embedding similarity.</text>
<text x="360" y="169" fill="var(--ink-3)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">By symbols alone, BM25 prefers lemmas about exp2R, which appears twice in the subgoal.</text>
<text x="14" y="193" fill="var(--rose)" font-size="14" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Validation with reflection</text>
<rect x="10" y="207" width="200" height="28" rx="6" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="110" y="226" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">intros l1 l2 pos.</text>
<text x="222" y="226" fill="var(--ink-3)" font-size="12.5" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">safe kind: not reflected</text>
<rect x="10" y="243" width="200" height="28" rx="6" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="110" y="262" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">induction l1.</text>
<text x="222" y="262" fill="var(--rose)" font-size="12.5" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">risky kind: reflected</text>
<rect x="10" y="279" width="200" height="28" rx="6" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="110" y="298" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" font-family="var(--font-mono)" style="font-variant-ligatures:none;font-feature-settings:normal" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">simpl.</text>
<text x="222" y="298" fill="var(--ink-3)" font-size="12.5" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">dropped with the rest</text>
<rect x="400" y="207" width="310" height="100" rx="8" fill="var(--rose)" fill-opacity="0.1" stroke="var(--rose)" stroke-width="1.8"/>
<text x="555.0" y="235.5" fill="var(--rose)" font-size="13.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">reflection</text>
<text x="555.0" y="254.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">induction after intros fixes pos,</text>
<text x="555.0" y="271.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">so the hypothesis IHl1 does not</text>
<text x="555.0" y="288.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">match the goal: misapplied</text>
<line x1="380" y1="257" x2="398" y2="257" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="10" y="325" width="700" height="52" rx="8" fill="var(--rose)" fill-opacity="0.06" stroke="var(--rose)" stroke-width="1.8"/>
<text x="360.0" y="346.5" fill="var(--rose)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">failure record → added to the prompt for this subgoal</text>
<text x="360.0" y="365.5" fill="var(--ink-2)" font-size="12.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">subgoal, the tactics tried, and the explanation, so the next attempt can induct first</text>
</svg>
