<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="PPO versus GRPO. In PPO, the policy writes one response per prompt, a reward model scores it, and a value model of the same size as the policy estimates the expected reward of every state; GAE turns these into per-token advantages. In GRPO, the policy writes a group of responses to the same prompt, each one is scored, and each advantage is the reward minus the group mean, divided by the group standard deviation. There is no value model." font-family="var(--font-sans)">
