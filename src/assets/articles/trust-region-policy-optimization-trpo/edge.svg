<path d="M312.9,166.0 L312.3,163.5 L311.7,161.1 L311.1,158.7 L310.5,156.2 L309.9,153.9 L309.2,151.5 L308.6,149.1 L307.9,146.8 L307.2,144.5 L306.4,142.2 L305.7,139.9 L305.0,137.7 L304.2,135.5 L303.4,133.3 L302.6,131.1 L301.8,128.9 L300.9,126.8 L300.1,124.7 L299.2,122.6 L298.3,120.6 L297.4,118.6 L296.5,116.6 L295.6,114.6 L294.7,112.6 L293.7,110.7 L292.7,108.9 L291.7,107.0 L290.8,105.2 L289.7,103.4 L288.7,101.6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#e-orange)"/>
