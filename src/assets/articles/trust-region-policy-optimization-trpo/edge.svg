<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-label="At A, g and F delta theta point in different directions. The edge of the trust region is an ellipse. At point A, the gradient g has a part along the edge, so sliding along the edge still improves the objective. At the best point B, g points straight out of the edge, in the same direction as F times delta theta. The best step goes from the center to B, along F inverse g." font-family="var(--font-sans)">
<defs>
<marker id="e-ink3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker>
<marker id="e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
<marker id="e-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--green)"/></marker>
<marker id="e-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="e-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
</defs>
<ellipse cx="230.0" cy="240.0" rx="82.5" ry="165.0" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="2.2"/>
