<text x="341.4" y="43.9" fill="var(--ink)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">same direction: g = λ FΔθ</text>
</svg>
