<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Six responses in a GRPO group. Responses 1 and 2 share the prefix AB, responses 3, 4 and 5 share the prefix JKL, and responses 4 and 5 also share NQ. Each shared prefix is a process step whose reward is the mean reward of the responses that share it: 0.50 for AB, 0.33 for JKL, and 0.00 for NQ. The group mean is 0.42." font-family="var(--font-sans)">
