<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="GenPRM. Top: to judge a step, GenPRM writes N rationales, each with reasoning and code; the code is run, each rationale ends with a probability of Yes, and the probabilities are averaged into the step's reward. Bottom: to label a step for training, the Monte Carlo estimate before the step, 0.50, and after it, 0.20, give a relative progress of 0.4, which is below the threshold 0.8, so the step is labeled wrong." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="22" fill="var(--green)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Judging step t</text>
<rect x="20" y="34" width="110" height="52" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="75" y="56" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">step t</text>
<text x="75" y="74" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+ earlier steps</text>
<line x1="130" y1="60" x2="165" y2="39" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="170" y="30" width="150" height="18" rx="5" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.3"/>
<text x="245" y="43" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rationale 1: reasoning + code</text>
<line x1="320" y1="39" x2="345" y2="39" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="350" y="30" width="92" height="18" rx="5" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.3"/>
<text x="396" y="43" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run code → fₜ</text>
<line x1="442" y1="39" x2="467" y2="39" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="472" y="30" width="86" height="18" rx="5" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.3"/>
<text x="515" y="43" fill="var(--green)" font-size="9.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">P(Yes) 0.9</text>
<line x1="558" y1="39" x2="598" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<line x1="130" y1="60" x2="165" y2="61" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="170" y="52" width="150" height="18" rx="5" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.3"/>
<text x="245" y="65" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rationale 2: reasoning + code</text>
<line x1="320" y1="61" x2="345" y2="61" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="350" y="52" width="92" height="18" rx="5" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.3"/>
<text x="396" y="65" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run code → fₜ</text>
<line x1="442" y1="61" x2="467" y2="61" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="472" y="52" width="86" height="18" rx="5" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.3"/>
<text x="515" y="65" fill="var(--green)" font-size="9.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">P(Yes) 0.8</text>
<line x1="558" y1="61" x2="598" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<line x1="130" y1="60" x2="165" y2="83" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="170" y="74" width="150" height="18" rx="5" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.3"/>
<text x="245" y="87" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rationale N: reasoning + code</text>
<line x1="320" y1="83" x2="345" y2="83" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="350" y="74" width="92" height="18" rx="5" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.3"/>
<text x="396" y="87" fill="var(--ink)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">run code → fₜ</text>
<line x1="442" y1="83" x2="467" y2="83" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="472" y="74" width="86" height="18" rx="5" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.3"/>
<text x="515" y="87" fill="var(--green)" font-size="9.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">P(Yes) 0.7</text>
<line x1="558" y1="83" x2="598" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="603" y="40" width="100" height="40" rx="8" fill="var(--link)" fill-opacity="0.14" stroke="var(--link)" stroke-width="1.8"/>
<text x="653" y="58" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">r̂ₜ = 0.80</text>
<text x="653" y="73" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">average</text>
<text x="20" y="124" fill="var(--amber)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Labeling step t for training (RPE)</text>
<rect x="20" y="136" width="130" height="52" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="85" y="158" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">MC(sₜ) = 0.50</text>
<text x="85" y="176" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">before the step</text>
<line x1="150" y1="162" x2="190" y2="162" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="195" y="136" width="130" height="52" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="260" y="158" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">MC(sₜ, aₜ) = 0.20</text>
<text x="260" y="176" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">after the step</text>
<line x1="325" y1="162" x2="365" y2="162" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="370" y="136" width="150" height="52" rx="8" fill="var(--amber)" fill-opacity="0.12" stroke="var(--amber)" stroke-width="1.8"/>
<text x="445" y="158" fill="var(--amber)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Pₜ = 0.20 / 0.50 = 0.4</text>
<text x="445" y="176" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">relative progress</text>
<line x1="520" y1="162" x2="560" y2="162" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="565" y="136" width="140" height="52" rx="8" fill="var(--rose)" fill-opacity="0.12" stroke="var(--rose)" stroke-width="1.8"/>
<text x="635" y="158" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.4 &lt; ε = 0.8</text>
<text x="635" y="176" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">label: wrong (0)</text>
</svg>
