<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-label="Coverage. The data contains the solutions a, b, c with score 1 and a prime, b prime, c prime with score 0. The new policy writes a, b prime, c. Every step has been seen before, so a model that scores steps can judge it, but the whole combination has never been seen, so a model that only scores whole solutions has to guess." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="22" fill="var(--ink-2)" font-size="12" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Data (written by the data policy)</text>
<rect x="20" y="36" width="34" height="26" rx="5" fill="var(--link)" fill-opacity="0.16" stroke="var(--link)" stroke-width="1.5"/><text x="37.0" y="54" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a</text>
<line x1="54" y1="49" x2="66" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="68" y="36" width="34" height="26" rx="5" fill="var(--link)" fill-opacity="0.16" stroke="var(--link)" stroke-width="1.5"/><text x="85.0" y="54" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">b</text>
<line x1="102" y1="49" x2="114" y2="49" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="116" y="36" width="34" height="26" rx="5" fill="var(--link)" fill-opacity="0.16" stroke="var(--link)" stroke-width="1.5"/><text x="133.0" y="54" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">c</text>
<text x="180" y="54" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">score 1</text>
<rect x="20" y="74" width="34" height="26" rx="5" fill="var(--amber)" fill-opacity="0.16" stroke="var(--amber)" stroke-width="1.5"/><text x="37.0" y="92" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a′</text>
<line x1="54" y1="87" x2="66" y2="87" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="68" y="74" width="34" height="26" rx="5" fill="var(--amber)" fill-opacity="0.16" stroke="var(--amber)" stroke-width="1.5"/><text x="85.0" y="92" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">b′</text>
<line x1="102" y1="87" x2="114" y2="87" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="116" y="74" width="34" height="26" rx="5" fill="var(--amber)" fill-opacity="0.16" stroke="var(--amber)" stroke-width="1.5"/><text x="133.0" y="92" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">c′</text>
<text x="180" y="92" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">score 0</text>
<text x="400" y="22" fill="var(--ink-2)" font-size="12" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">New policy writes</text>
<rect x="400" y="55" width="34" height="26" rx="5" fill="var(--link)" fill-opacity="0.16" stroke="var(--link)" stroke-width="1.5"/><text x="417.0" y="73" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a</text>
<line x1="434" y1="68" x2="446" y2="68" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="448" y="55" width="34" height="26" rx="5" fill="var(--amber)" fill-opacity="0.16" stroke="var(--amber)" stroke-width="1.5"/><text x="465.0" y="73" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">b′</text>
<line x1="482" y1="68" x2="494" y2="68" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="496" y="55" width="34" height="26" rx="5" fill="var(--link)" fill-opacity="0.16" stroke="var(--link)" stroke-width="1.5"/><text x="513.0" y="73" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">c</text>
<text x="560" y="73" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">score ?</text>
<line x1="250" y1="68" x2="385" y2="68" stroke="var(--ink-3)" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a-ink)"/>
<rect x="20" y="130" width="330" height="52" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="185" y="152" fill="var(--green)" font-size="11.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">every step has been seen before</text>
<text x="185" y="170" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a step-level model can score it (step coverage)</text>
<rect x="370" y="130" width="330" height="52" rx="8" fill="var(--rose)" fill-opacity="0.1" stroke="var(--rose)" stroke-width="1.8"/>
<text x="535" y="152" fill="var(--rose)" font-size="11.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">this whole combination has never been seen</text>
<text x="535" y="170" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a whole-solution model must guess (trajectory coverage)</text>
</svg>
