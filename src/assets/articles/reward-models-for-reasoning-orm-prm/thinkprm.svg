<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" role="img" aria-label="ThinkPRM. Top: QwQ-32B-Preview verifies solutions from PRM800K, and a chain is kept only if it has a label for every step, its labels match the human labels, and it is at most 4,096 tokens long, leaving 1,000 chains with 8,000 step labels. Bottom: verification compute is scaled either in parallel, by averaging the scores of K independent chains, or sequentially, by appending Let's verify again so that the model rechecks its own verification." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="22" fill="var(--amber)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Collecting training chains</text>
<rect x="20" y="34" width="140" height="52" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="90" y="56" fill="var(--ink)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">QwQ-32B-Preview</text>
<text x="90" y="74" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">verifies PRM800K solutions</text>
<line x1="160" y1="60" x2="190" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="195" y="34" width="128" height="52" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="259" y="56" fill="var(--ink)" font-size="10" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a label for every step</text>
<text x="259" y="74" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">format check</text>
<line x1="323" y1="60" x2="333" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="335" y="34" width="128" height="52" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="399" y="56" fill="var(--ink)" font-size="10" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">labels match PRM800K</text>
<text x="399" y="74" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">agrees with humans</text>
<line x1="463" y1="60" x2="473" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="475" y="34" width="128" height="52" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="539" y="56" fill="var(--ink)" font-size="10" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">at most 4,096 tokens</text>
<text x="539" y="74" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no overthinking</text>
<line x1="603" y1="60" x2="613" y2="60" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="615" y="34" width="95" height="52" rx="8" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.8"/>
<text x="662" y="56" fill="var(--green)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1K chains</text>
<text x="662" y="74" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8K step labels</text>
<text x="20" y="122" fill="var(--link)" font-size="13" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Spending more compute on verification</text>
<text x="20" y="144" fill="var(--ink-2)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Parallel: K independent chains, scores averaged</text>
<rect x="20" y="154" width="200" height="18" rx="5" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="1.3"/>
<text x="120" y="167" fill="var(--ink)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">chain 1 → score 0.05</text>
<line x1="220" y1="163" x2="250" y2="190" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="20" y="178" width="200" height="18" rx="5" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="1.3"/>
<text x="120" y="191" fill="var(--ink)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">chain 2 → score 0.02</text>
<line x1="220" y1="187" x2="250" y2="190" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="20" y="202" width="200" height="18" rx="5" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="1.3"/>
<text x="120" y="215" fill="var(--ink)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">chain K → score 0.04</text>
<line x1="220" y1="211" x2="250" y2="190" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="255" y="172" width="100" height="36" rx="8" fill="var(--link)" fill-opacity="0.14" stroke="var(--link)" stroke-width="1.8"/>
<text x="305" y="194" fill="var(--link)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mean = 0.037</text>
<text x="400" y="144" fill="var(--ink-2)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Sequential: the model rechecks its own check</text>
<rect x="400" y="158" width="90" height="40" rx="8" fill="var(--link)" fill-opacity="0.08" stroke="var(--link)" stroke-width="1.8"/>
<text x="445" y="182" fill="var(--ink)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">first chain</text>
<line x1="490" y1="178" x2="515" y2="178" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="520" y="158" width="190" height="40" rx="8" fill="var(--link)" fill-opacity="0.12" stroke="var(--link)" stroke-width="1.8"/>
<text x="615" y="176" fill="var(--link)" font-size="10.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">"Let's verify again"</text>
<text x="615" y="191" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">→ the chain continues</text>
</svg>
