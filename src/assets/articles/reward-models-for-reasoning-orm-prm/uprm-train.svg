<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="One training step of an unsupervised PRM. 1: take N solutions with no labels. 2: the PRM, the LLM with LoRA and a small head, gives a distribution over the first-error position for each. 3: sample one position per solution. 4: write plus and minus marks from the positions by a fixed rule. 5: the frozen LLM reads the marked batch and gives a joint score. 6: update the PRM so that guesses that scored above average become more likely, with an entropy bonus, and repeat." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<rect x="10" y="30" width="160" height="74" rx="8" fill="var(--ink-3)" fill-opacity="0.1" stroke="var(--ink-3)" stroke-width="1.8"/>
<circle cx="26" cy="30" r="10" fill="var(--ink-3)" fill-opacity="0.9"/><text x="26" y="34" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >1</text>
<text x="90" y="56" fill="var(--ink-3)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">N solutions</text>
<text x="90" y="74" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">from the dataset,</text>
<text x="90" y="90" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no labels at all</text>
<line x1="170" y1="67" x2="196" y2="67" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="190" y="30" width="160" height="74" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<circle cx="206" cy="30" r="10" fill="var(--link)" fill-opacity="0.9"/><text x="206" y="34" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >2</text>
<text x="270" y="56" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PRM being trained</text>
<text x="270" y="74" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">LLM + LoRA + small head</text>
<text x="270" y="90" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gives p(j) for each solution</text>
<line x1="350" y1="67" x2="376" y2="67" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="370" y="30" width="160" height="74" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<circle cx="386" cy="30" r="10" fill="var(--link)" fill-opacity="0.9"/><text x="386" y="34" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >3</text>
<text x="450" y="56" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">sample a position</text>
<text x="450" y="74" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">for each solution:</text>
<text x="450" y="90" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">e.g. j = 3, none, 2</text>
<line x1="530" y1="67" x2="556" y2="67" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="550" y="30" width="160" height="74" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<circle cx="566" cy="30" r="10" fill="var(--green)" fill-opacity="0.9"/><text x="566" y="34" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >4</text>
<text x="630" y="56" fill="var(--green)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">write the marks</text>
<text x="630" y="74" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+ after steps before j,</text>
<text x="630" y="90" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">− after step j</text>
<line x1="630" y1="104" x2="630" y2="138" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="550" y="142" width="160" height="74" rx="8" fill="var(--amber)" fill-opacity="0.12" stroke="var(--amber)" stroke-width="1.8"/>
<circle cx="566" cy="142" r="10" fill="var(--amber)" fill-opacity="0.9"/><text x="566" y="146" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >5</text>
<text x="630" y="168" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">frozen LLM</text>
<text x="630" y="186" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">reads the marked batch,</text>
<text x="630" y="202" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gives joint score S</text>
<line x1="550" y1="179" x2="454" y2="179" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="190" y="142" width="260" height="74" rx="8" fill="var(--rose)" fill-opacity="0.08" stroke="var(--rose)" stroke-width="1.8"/>
<circle cx="206" cy="142" r="10" fill="var(--rose)" fill-opacity="0.9"/><text x="206" y="146" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle" >6</text>
<text x="320" y="168" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">update the PRM</text>
<text x="320" y="186" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">positions that scored above average</text>
<text x="320" y="202" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">become more likely; + entropy bonus</text>
<line x1="270" y1="142" x2="270" y2="108" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="95" y="170" fill="var(--ink-3)" font-size="10.5" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">repeat with</text>
<text x="95" y="186" fill="var(--ink-3)" font-size="10.5" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">a new batch</text>
</svg>
