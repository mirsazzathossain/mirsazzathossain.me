<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 369" role="img" aria-label="The text ThinkPRM reads and writes for the rectangle example. Given the problem and four steps, it writes a verification chain inside think tags that critiques each step and ends each critique with a boxed label: correct for steps 1 and 2, incorrect for step 3, where it stops. The question Is the solution correct is then appended, and the score is the probability of yes divided by the probabilities of yes and no, about 0.03." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="61.5" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Input</text>
<text x="20" y="76.5" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">given</text>
<rect x="170" y="14" width="540" height="99" rx="6" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.5"/>
<text x="182" y="34" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Problem: length = 2 × width, perimeter = 36. Find the width.</text>
<text x="182" y="51" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 1: let the width be w</text>
<text x="182" y="68" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 2: then the length is 2w</text>
<text x="182" y="85" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 3: perimeter = w + 2w = 3w</text>
<text x="182" y="102" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 4: 3w = 36, so w = 12</text>
<text x="20" y="196.0" fill="var(--green)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verification chain</text>
<text x="20" y="211.0" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">written by ThinkPRM</text>
<rect x="170" y="123" width="540" height="150" rx="6" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.5"/>
<text x="182" y="143" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&lt;think&gt; Let's verify step by step.</text>
<text x="182" y="160" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 1: "let the width be w". Critique: a fine choice of variable.</text>
<text x="182" y="177" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">The step is \boxed{correct}</text>
<text x="182" y="194" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 2: "the length is 2w". Critique: the problem says the length is</text>
<text x="182" y="211" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">twice the width, so this is right. The step is \boxed{correct}</text>
<text x="182" y="228" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 3: "perimeter = w + 2w = 3w". Critique: a rectangle has two</text>
<text x="182" y="245" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">widths and two lengths, so the perimeter is 2(w + 2w) = 6w.</text>
<text x="182" y="262" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">The step is \boxed{incorrect}   (stops at the first wrong step)  &lt;/think&gt;</text>
<text x="20" y="296.5" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Forced question</text>
<text x="20" y="311.5" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">added by us</text>
<rect x="170" y="283" width="540" height="31" rx="6" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.5"/>
<text x="182" y="303" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Is the solution correct?</text>
<text x="20" y="337.5" fill="var(--link)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Score</text>
<rect x="170" y="324" width="540" height="31" rx="6" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.5"/>
<text x="182" y="344" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">P("yes") = 0.03,  P("no") = 0.95   →   score = 0.03 / (0.03 + 0.95) ≈ 0.03</text>
</svg>
