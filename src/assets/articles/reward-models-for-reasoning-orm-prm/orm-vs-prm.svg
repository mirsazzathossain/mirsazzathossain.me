<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="A four-step solution with an error in step 3. An outcome reward model gives one low score to the whole solution. A process reward model gives a score to every step: high for steps 1 and 2, low for steps 3 and 4, which shows where the solution went wrong." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="360" y="22" fill="var(--ink-2)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Problem: a rectangle's length is twice its width, and its perimeter is 36. Find the width.</text>
<rect x="230" y="44" width="260" height="38" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="360" y="68" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 1: let the width be w</text>
<line x1="492" y1="63" x2="540" y2="63" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="546" y="49" width="74" height="28" rx="8" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.8"/>
<text x="583" y="68" fill="var(--green)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.97</text>
<text x="652" y="68" fill="var(--green)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">correct</text>
<rect x="230" y="94" width="260" height="38" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="360" y="118" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 2: then the length is 2w</text>
<line x1="492" y1="113" x2="540" y2="113" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="546" y="99" width="74" height="28" rx="8" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.8"/>
<text x="583" y="118" fill="var(--green)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.94</text>
<text x="652" y="118" fill="var(--green)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">correct</text>
<rect x="230" y="144" width="260" height="38" rx="8" fill="var(--rose)" fill-opacity="0.08" stroke="var(--rose)" stroke-width="1.8"/>
<text x="360" y="168" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 3: perimeter = w + 2w = 3w</text>
<line x1="492" y1="163" x2="540" y2="163" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="546" y="149" width="74" height="28" rx="8" fill="var(--rose)" fill-opacity="0.14" stroke="var(--rose)" stroke-width="1.8"/>
<text x="583" y="168" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.05</text>
<text x="652" y="168" fill="var(--rose)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wrong</text>
<rect x="230" y="194" width="260" height="38" rx="8" fill="var(--rose)" fill-opacity="0.08" stroke="var(--rose)" stroke-width="1.8"/>
<text x="360" y="218" fill="var(--ink)" font-size="12" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 4: 3w = 36, so w = 12</text>
<line x1="492" y1="213" x2="540" y2="213" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="546" y="199" width="74" height="28" rx="8" fill="var(--rose)" fill-opacity="0.14" stroke="var(--rose)" stroke-width="1.8"/>
<text x="583" y="218" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.03</text>
<text x="652" y="218" fill="var(--rose)" font-size="11" font-weight="600" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wrong</text>
<text x="583" y="36" fill="var(--green)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PRM: one score per step</text>
<path d="M210,48 Q195,48 195,62 L195,128 Q195,140 182,141 Q195,142 195,154 L195,222 Q195,236 210,236" fill="none" stroke="var(--ink-3)" stroke-width="2"/>
<rect x="70" y="124" width="100" height="36" rx="8" fill="var(--link)" fill-opacity="0.14" stroke="var(--link)" stroke-width="1.8"/>
<text x="120" y="147" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0.04</text>
<text x="120" y="112" fill="var(--link)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ORM: one score</text>
<text x="120" y="180" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">for the whole solution</text>
</svg>
