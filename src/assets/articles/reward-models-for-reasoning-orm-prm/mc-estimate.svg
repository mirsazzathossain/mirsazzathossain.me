<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Monte Carlo estimation of a step's quality. From a solution prefix, the policy writes eight completions. Five reach the correct answer and three do not, so the prefix gets the estimate five eighths." font-family="var(--font-sans)">
