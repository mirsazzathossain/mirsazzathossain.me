<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" role="img" aria-label="A verified correct chain of five steps, and its counterfactual copy. The counterfactual keeps steps 1 and 2, replaces step 3 with an injected error that cannot be derived from steps 1 and 2, and recomputes steps 4 and 5 from the corrupted step with the symbolic prover." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="26" fill="var(--green)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verified correct chain C+</text>
<rect x="40" y="38" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="90" y="62" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s1</text>
<line x1="140" y1="57" x2="168" y2="57" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="170" y="38" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="220" y="62" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s2</text>
<line x1="270" y1="57" x2="298" y2="57" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="300" y="38" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="350" y="62" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s3</text>
<line x1="400" y1="57" x2="428" y2="57" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="430" y="38" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="480" y="62" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s4</text>
<line x1="530" y1="57" x2="558" y2="57" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="560" y="38" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="610" y="62" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s5</text>
<text x="20" y="118" fill="var(--rose)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Counterfactual chain C−</text>
<rect x="40" y="130" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="90" y="154" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s1</text>
<line x1="140" y1="149" x2="168" y2="149" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="170" y="130" width="100" height="38" rx="8" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="1.8"/>
<text x="220" y="154" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s2</text>
<line x1="270" y1="149" x2="298" y2="149" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="300" y="130" width="100" height="38" rx="8" fill="var(--rose)" fill-opacity="0.14" stroke="var(--rose)" stroke-width="1.8"/>
<text x="350" y="154" fill="var(--rose)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s̃3  (error)</text>
<line x1="400" y1="149" x2="428" y2="149" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="430" y="130" width="100" height="38" rx="8" fill="var(--amber)" fill-opacity="0.12" stroke="var(--amber)" stroke-width="1.8"/>
<text x="480" y="154" fill="var(--amber)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s4′  recomputed</text>
<line x1="530" y1="149" x2="558" y2="149" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="560" y="130" width="100" height="38" rx="8" fill="var(--amber)" fill-opacity="0.12" stroke="var(--amber)" stroke-width="1.8"/>
<text x="610" y="154" fill="var(--amber)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">s5′  recomputed</text>
<text x="90" y="196" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">same prefix</text>
<text x="350" y="196" fill="var(--rose)" font-size="11" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">first error at k = 3</text>
<text x="350" y="212" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">not derivable from s1, s2</text>
<text x="565" y="196" fill="var(--amber)" font-size="11" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">follow from s̃3 by the prover</text>
</svg>
