<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" role="img" aria-label="The Offline Outcome-to-Process Transformation. Outcome data, solutions with a total score, is split in two halves. On the first half, step rewards are fitted by least squares so that they add up to each total score. The fitted reward model labels every step of the second half, and any offline reinforcement learning algorithm for step rewards is run on the result." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<rect x="20" y="88" width="120" height="58" rx="8" fill="var(--ink-3)" fill-opacity="0.06" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="80" y="110" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Outcome data</text>
<text x="80" y="128" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">solutions + total score R</text>
<line x1="140" y1="104" x2="175" y2="56" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<line x1="140" y1="130" x2="175" y2="176" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="180" y="36" width="80" height="40" rx="8" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.8"/>
<text x="220" y="60" fill="var(--amber)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">half 1</text>
<rect x="180" y="156" width="80" height="40" rx="8" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.8"/>
<text x="220" y="180" fill="var(--link)" font-size="11" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">half 2</text>
<line x1="260" y1="56" x2="290" y2="56" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="295" y="26" width="200" height="60" rx="8" fill="var(--amber)" fill-opacity="0.12" stroke="var(--amber)" stroke-width="1.8"/>
<text x="395" y="50" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">fit step rewards r̂</text>
<text x="395" y="68" fill="var(--ink-3)" font-size="9.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">that add up to each R (least squares)</text>
<line x1="395" y1="86" x2="395" y2="144" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="405" y="120" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">r̂</text>
<line x1="260" y1="176" x2="290" y2="176" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="295" y="146" width="200" height="60" rx="8" fill="var(--link)" fill-opacity="0.12" stroke="var(--link)" stroke-width="1.8"/>
<text x="395" y="170" fill="var(--link)" font-size="12" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">label every step</text>
<text x="395" y="188" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rₕ = r̂(sₕ, aₕ)</text>
<line x1="495" y1="176" x2="520" y2="176" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="525" y="150" width="85" height="52" rx="8" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.8"/>
<text x="567" y="172" fill="var(--green)" font-size="10.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">step-labeled</text>
<text x="567" y="188" fill="var(--green)" font-size="10.5" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">data</text>
<line x1="610" y1="176" x2="630" y2="176" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="635" y="150" width="75" height="52" rx="8" fill="var(--green)" fill-opacity="0.16" stroke="var(--green)" stroke-width="1.8"/>
<text x="672" y="172" fill="var(--green)" font-size="10" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">any offline</text>
<text x="672" y="188" fill="var(--green)" font-size="10" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">RL → policy</text>
</svg>
