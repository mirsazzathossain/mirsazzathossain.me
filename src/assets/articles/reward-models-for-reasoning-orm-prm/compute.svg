<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" role="img" aria-label="Left: with a verification as long as a solution, eight solutions with a majority vote cost the same as two solutions verified three times each, since 2 times 1 plus 3 is 8. Right: a schematic of accuracy against compute. Self-consistency is better at low budgets, and the generative reward model only overtakes it at around eight times the compute." font-family="var(--font-sans)">
