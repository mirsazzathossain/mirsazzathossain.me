<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 337" role="img" aria-label="The text GenPRM sees and writes when judging step 3 of the rectangle example. The input is the problem and steps 1 to 3. GenPRM writes a rationale with reasoning in analyze tags, noting that the perimeter should be 2 times w plus 2w, and code in verify tags that prints both formulas for w equal to 5. The interpreter returns the output 15 30. GenPRM concludes that step 3 is incorrect, and the probability of Yes is 0.04." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="20" y="53.0" fill="var(--ink)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Input</text>
<text x="20" y="68.0" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">given</text>
<rect x="150" y="14" width="560" height="82" rx="6" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.5"/>
<text x="162" y="34" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Problem: length = 2 × width, perimeter = 36. Find the width.</text>
<text x="162" y="51" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 1: let the width be w</text>
<text x="162" y="68" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 2: then the length is 2w</text>
<text x="162" y="85" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Step 3: perimeter = w + 2w = 3w   (the step being judged, aₜ)</text>
<text x="20" y="128.0" fill="var(--green)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Rationale vₜ</text>
<text x="20" y="143.0" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">reasoning</text>
<rect x="150" y="106" width="560" height="48" rx="6" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.5"/>
<text x="162" y="126" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&lt;analyze&gt; Step 3 adds the width and the length once. A rectangle has</text>
<text x="162" y="143" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">two widths and two lengths, so the perimeter is 2(w + 2w) = 6w. &lt;/analyze&gt;</text>
<text x="20" y="186.0" fill="var(--green)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Rationale vₜ</text>
<text x="20" y="201.0" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">code</text>
<rect x="150" y="164" width="560" height="48" rx="6" fill="var(--green)" fill-opacity="0.1" stroke="var(--green)" stroke-width="1.5"/>
<text x="162" y="184" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&lt;verify&gt; w = 5</text>
<text x="162" y="201" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">print(w + 2*w, 2*(w + 2*w)) &lt;/verify&gt;</text>
<text x="20" y="235.5" fill="var(--amber)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Feedback fₜ</text>
<text x="20" y="250.5" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">from the interpreter</text>
<rect x="150" y="222" width="560" height="31" rx="6" fill="var(--amber)" fill-opacity="0.1" stroke="var(--amber)" stroke-width="1.5"/>
<text x="162" y="242" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">[Code output: 15 30]</text>
<text x="20" y="285.0" fill="var(--link)" font-size="12" font-weight="700" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verdict</text>
<rect x="150" y="263" width="560" height="48" rx="6" fill="var(--link)" fill-opacity="0.1" stroke="var(--link)" stroke-width="1.5"/>
<text x="162" y="283" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">15 ≠ 30, so Step 3 is incorrect. Is the step correct? No</text>
<text x="162" y="300" fill="var(--ink)" font-size="10.5" font-weight="400" text-anchor="start" font-family="var(--font-mono)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">reward: P(Yes) = 0.04</text>
<text x="430" y="327" fill="var(--ink-3)" font-size="10.5" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">written by GenPRM: green and blue · run by Python: amber</text>
</svg>
