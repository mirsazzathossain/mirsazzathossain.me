<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="The three stages of RLHF. Stage 1: human demonstrations train the SFT model. Stage 2: human comparisons between responses train the reward model. Stage 3: PPO trains the policy, starting from the SFT model, using the reward model for rewards and a frozen copy of the SFT model as the reference." font-family="var(--font-sans)">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text x="120" y="22" fill="var(--link)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Stage 1: SFT</text>
<rect x="10" y="36" width="220" height="62" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="120" y="62" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Human demonstrations</text>
<text x="120" y="81" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">prompt → good answer</text>
<line x1="120" y1="98" x2="120" y2="140" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="30" y="145" width="180" height="50" rx="8" fill="var(--link)" fill-opacity="0.14" stroke="var(--link)" stroke-width="1.8"/>
<text x="120" y="175" fill="var(--link)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SFT model π<tspan baseline-shift="sub" font-size="10">SFT</tspan></text>
<text x="360" y="22" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Stage 2: Reward model</text>
<rect x="250" y="36" width="220" height="62" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="360" y="62" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Human comparisons</text>
<text x="360" y="81" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">answer A is better than B</text>
<line x1="360" y1="98" x2="360" y2="140" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="270" y="145" width="180" height="50" rx="8" fill="var(--green)" fill-opacity="0.14" stroke="var(--green)" stroke-width="1.8"/>
<text x="360" y="175" fill="var(--green)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Reward model r<tspan baseline-shift="sub" font-size="10">ψ</tspan></text>
<text x="600" y="22" fill="#8b5cf6" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Stage 3: RL with PPO</text>
<rect x="490" y="36" width="220" height="62" rx="8" fill="var(--ink-3)" fill-opacity="0.05" stroke="var(--ink-3)" stroke-width="1.8"/>
<text x="600" y="62" fill="var(--ink)" font-size="12" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Prompts only</text>
<text x="600" y="81" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">the policy writes, r<tspan baseline-shift="sub" font-size="10">ψ</tspan> scores</text>
<line x1="600" y1="98" x2="600" y2="140" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<rect x="510" y="145" width="180" height="50" rx="8" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-width="1.8"/>
<text x="600" y="175" fill="#8b5cf6" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Final policy π<tspan baseline-shift="sub" font-size="10">θ</tspan></text>
<path d="M130,195 V222 H360 V200" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-ink)"/>
<text x="245" y="217" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">initializes</text>
<path d="M90,195 V262 H600 V200" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-ink)"/>
<text x="345" y="257" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">initializes the policy; frozen copy = reference π<tspan baseline-shift="sub" font-size="10">ref</tspan></text>
<line x1="450" y1="170" x2="505" y2="170" stroke="var(--ink-3)" stroke-width="2.2" marker-end="url(#a-ink)"/>
<text x="478" y="162" fill="var(--ink-3)" font-size="10" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rewards</text>
</svg>
