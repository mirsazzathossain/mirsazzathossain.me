<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="The clipped objective as a function of the probability ratio. For a positive advantage, it grows with the ratio until 1 plus epsilon and then stays flat. For a negative advantage, it is flat below 1 minus epsilon and decreases above it. In the flat regions the gradient is zero." font-family="var(--font-sans)">
<line x1="30" y1="150" x2="298.0" y2="150" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="30" y1="40.0" x2="30" y2="260.0" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="134.0" y1="40.0" x2="134.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="134.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1−ε</text>
<line x1="160.0" y1="40.0" x2="160.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="160.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<line x1="186.0" y1="40.0" x2="186.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="186.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1+ε</text>
<text x="298.0" y="166" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="end" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ratio ρ</text>
<rect x="186.0" y="40.0" width="104.0" height="220.0" fill="#f59e0b" fill-opacity="0.10"/>
<text x="238.0" y="54.0" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">clipped: no gradient</text>
<path d="M30.0,150.0 L186.0,90.6 L290.0,90.6" fill="none" stroke="var(--link)" stroke-width="2.6"/>
<circle cx="160.0" cy="100.5" r="4.5" fill="var(--ink)"/>
<text x="170" y="24" fill="var(--ink)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Advantage A &gt; 0 (good token)</text>
<text x="34" y="34.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">L<tspan baseline-shift="super" font-size="8">CLIP</tspan></text>
<line x1="370" y1="150" x2="638.0" y2="150" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="370" y1="40.0" x2="370" y2="260.0" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="474.0" y1="40.0" x2="474.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="474.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1−ε</text>
<line x1="500.0" y1="40.0" x2="500.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="500.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1</text>
<line x1="526.0" y1="40.0" x2="526.0" y2="260.0" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="526.0" y="276.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1+ε</text>
<text x="638.0" y="166" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="end" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ratio ρ</text>
<rect x="370" y="40.0" width="104.0" height="220.0" fill="#f59e0b" fill-opacity="0.10"/>
<text x="422.0" y="252.0" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">clipped: no gradient</text>
<path d="M370.0,189.6 L474.0,189.6 L630.0,249.0" fill="none" stroke="var(--link)" stroke-width="2.6"/>
<circle cx="500.0" cy="199.5" r="4.5" fill="var(--ink)"/>
<text x="510" y="24" fill="var(--ink)" font-size="13" font-weight="700" text-anchor="middle" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Advantage A &lt; 0 (bad token)</text>
<text x="374" y="34.0" fill="var(--ink-3)" font-size="11" font-weight="400" text-anchor="start" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">L<tspan baseline-shift="super" font-size="8">CLIP</tspan></text>
</svg>
